name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-linux:
    name: Cœur (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: SQLite (en-têtes)
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev
      - name: Tests du cœur
        run: swift test --package-path Core

  ios:
    name: App iOS (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: xcodebuild -version && swift --version
      - name: Tests du cœur (CryptoKit, SQLite du système)
        run: swift test --package-path Core
      - name: Projet Xcode (XcodeGen)
        run: brew install xcodegen && xcodegen generate
      - name: Compilation pour le simulateur
        run: |
          set -o pipefail
          xcodebuild -project Phototheque.xcodeproj -scheme Phototheque -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60
      - name: Lancement dans le simulateur + import de 3 photos
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone')))")
          echo "Simulateur : $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=$(find build/sim/Build/Products -name 'Phototheque.app' -maxdepth 2 | head -1)
          xcrun simctl install "$UDID" "$APP"
          SIMCTL_CHILD_PHOTOTHEQUE_DEMO_DIR="$PWD/ci/photos" xcrun simctl launch "$UDID" fr.vifi31.phototheque
          sleep 20
          xcrun simctl io "$UDID" screenshot simulateur.png
          DATA=$(xcrun simctl get_app_container "$UDID" fr.vifi31.phototheque data)
          DB="$DATA/Documents/Photothèque/catalogue.sqlite"
          sqlite3 "$DB" "SELECT file_name, rel_path, camera_model, taken_at, width || 'x' || height, dhash FROM photos ORDER BY file_name;"
          N=$(sqlite3 "$DB" "SELECT COUNT(*) FROM photos WHERE dhash IS NOT NULL AND camera_model LIKE 'Canon EOS%' AND taken_at IS NOT NULL;")
          echo "Photos importées avec métadonnées et empreinte : $N"
          test "$N" = "3"
          ls "$DATA/Library/Caches/Vignettes" | head
          # L'application tourne toujours (pas de plantage au lancement ni à l'import).
          xcrun simctl spawn "$UDID" launchctl list > processus.txt
          grep -q fr.vifi31.phototheque processus.txt
      - name: Compilation pour iPhone (non signée) + .ipa
        run: |
          set -o pipefail
          xcodebuild -project Phototheque.xcodeproj -scheme Phototheque -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -n 40
          VERSION=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"(.*)".*/\1/')
          mkdir -p Payload
          cp -R build/device/Build/Products/Release-iphoneos/Phototheque.app Payload/
          zip -qry "Phototheque-$VERSION-non-signee.ipa" Payload
          shasum -a 256 *.ipa | tee SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Phototheque-iOS
          path: |
            *.ipa
            SHA256SUMS
            simulateur.png
      - name: Publication (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.ipa SHA256SUMS simulateur.png --title "Photothèque iOS $GITHUB_REF_NAME" --notes-file CHANGELOG.md
